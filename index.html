<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>rzbal Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="dns-prefetch" href="//telegram.org" />
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try { localStorage.removeItem('hub-theme'); } catch (e) {}
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
        document.documentElement.setAttribute('data-theme', 'dark');
        var c = '#1a1a1a';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', c);
        document.write('<style>#splash{background:' + c + '}</style>');
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    <script>
      (function() {
        function palette() {
          var dark = document.documentElement.classList.contains('dark');
          return dark ? '#1a1a1a' : '#fdfaf6';
        }
        function initTg() {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            var c = palette();
            tg.expand(); tg.ready();
            if (tg.setHeaderColor) tg.setHeaderColor(c);
            if (tg.setBackgroundColor) tg.setBackgroundColor(c);
          }
        }
        initTg();
        window.addEventListener('load', initTg);
        window.addEventListener('hub-theme-change', initTg);
      })();
    </script>
    <style>
      @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/Inter-400.woff2') format('woff2')}
      @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/Inter-600.woff2') format('woff2')}
      @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/Inter-700.woff2') format('woff2')}
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;z-index:9999;transition:opacity .3s}
      #splash.hide{opacity:0;pointer-events:none}
      #splash .dot{width:8px;height:8px;background:#e56a4a;border-radius:50%;animation:pulse 1s ease infinite}
      @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    </style>
  </head>
  <body>
    <div id="splash"><div class="dot"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
