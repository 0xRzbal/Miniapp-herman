<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>rzbal Hub — offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: #1a1a1a; color: #ededed;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .box { max-width: 320px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin: 0 auto 16px; }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 13px; line-height: 1.6; color: #9ca3af; margin: 0 0 20px; }
      button {
        font: inherit; font-size: 13px; font-weight: 600; color: #fff;
        background: #e56a4a; border: 0; border-radius: 10px; padding: 10px 18px;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot"></div>
      <h1>Tidak ada koneksi</h1>
      <p>Perangkat sedang offline. Coba lagi setelah jaringan kembali.</p>
      <button onclick="location.reload()">Muat ulang</button>
    </div>
    <script>
      addEventListener('online', () => location.replace('/'));
    </script>
  </body>
</html>
